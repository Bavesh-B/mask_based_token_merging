# MaskMerge WARM-STARTED from the trained dense EoMT, then fine-tuned WITH
# merging. Rationale: from-scratch MaskMerge relearns the whole head over 484
# epochs and plateaus at ~17.1 AP; the dense model already has a 21.6-AP head,
# so initializing from it and only adapting to the merged-token regime should
# land far closer to dense/ALGM (which is essentially "dense head + test-time
# merge" = 19.8).
#
# num_blocks=4 matches dense EXACTLY (queries reinsert at block 8 via
# query_reinsert_layer=9), so every dense weight loads (verified: 0 missing / 0
# unexpected / 0 shape-mismatch) and the inherited head is used the same way it
# was trained. Global merge at layer 7 (before the block-8 reinsert) keeps the
# merged tail (the 3.1x speed win). masked_attn on (structural match to dense +
# per-layer deep supervision); annealing OFF (dense already annealed its masks
# to ~off, so we fine-tune in that converged regime). merge_conf_threshold
# ramps 0.7 -> 0.0 over the 100 epochs so merging phases in gradually.
trainer:
  max_epochs: 100
  check_val_every_n_epoch: 10
model:
  class_path: training.mask_classification_instance.MaskClassificationInstance
  init_args:
    # warm-start: load the full trained dense EoMT (backbone + head)
    load_ckpt_class_head: True
    attn_mask_annealing_enabled: False
    network:
      class_path: models.maskmerge.EoMT
      init_args:
        num_q: 200
        num_blocks: 4
        masked_attn_enabled: True
        local_merge_enabled: True
        local_merge_after_layer: 1
        local_merge_window_size: [2, 2]
        local_merge_threshold: 0.88
        merge_start_layer: 7
        merge_interval: 20
        merge_conf_threshold: 0.7
        merge_conf_threshold_end: 0.0
        merge_schedule_epochs: 100
        merge_schedule_enabled: True
        global_merge_score_metric: cosine
        global_merge_mask_constraint: True
        global_merge_min_ratio: 0.0
        olam_mask_source: current
        query_insert_layer: 7
        query_reinsert_layer: 9
        encoder:
          class_path: models.vit.ViT
          init_args:
            patch_size: 16
            backbone_name: vit_base_patch14_reg4_dinov2
data:
  class_path: datasets.cityscapes_instance.CityscapesInstance
  init_args:
    num_classes: 8
    val_size: [512, 1024]
    img_size: [512, 1024]
    batch_size: 8
