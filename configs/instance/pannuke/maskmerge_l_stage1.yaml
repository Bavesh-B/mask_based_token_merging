# MaskMerge STAGE 1 on PanNuke, DINOv2 ViT-Large backbone.
# Mirrors the Base stage-1 recipe (maskmerge_finetune.yaml) exactly -- trains
# WITH merging from the timm ViT-L backbone for 60 epochs, merge schedule
# annealing over the full run. Its last.ckpt warm-starts stage 2. Only the
# backbone differs from Base stage 1.
trainer:
  max_epochs: 60
  check_val_every_n_epoch: 5
model:
  class_path: training.mask_classification_instance.MaskClassificationInstance
  init_args:
    attn_mask_annealing_enabled: False
    network:
      class_path: models.maskmerge.EoMT
      init_args:
        num_q: 200
        num_blocks: 3
        masked_attn_enabled: False
        local_merge_enabled: True
        local_merge_after_layer: 1
        local_merge_window_size: [2, 2]
        local_merge_threshold: 0.88
        merge_start_layer: 7
        merge_interval: 20
        merge_conf_threshold: 0.7
        merge_conf_threshold_end: 0.0
        merge_schedule_epochs: 60
        merge_schedule_enabled: True
        global_merge_score_metric: cosine
        global_merge_mask_constraint: True
        global_merge_min_ratio: 0.0
        olam_mask_source: current
        query_insert_layer: 7
        query_reinsert_layer: 10
        encoder:
          class_path: models.vit.ViT
          init_args:
            patch_size: 16
            backbone_name: vit_large_patch14_reg4_dinov2
data:
  class_path: datasets.pannuke_instance.PanNukeInstance
  init_args:
    num_classes: 5
    img_size: [640, 640]
    batch_size: 8
