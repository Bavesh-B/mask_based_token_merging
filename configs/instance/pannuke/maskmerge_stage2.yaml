# MaskMerge on PanNuke nuclei instance segmentation.
#
# MaskMerge trains WITH merging (mask-constrained: global_merge_mask_constraint
# uses the model's own predicted instance masks to gate merges -- the one
# criterion that is task/identity-aware, not appearance-only, so the one with a
# mechanistic shot at beating the locality gate on adjacent twins).
#
# It cannot be run zero-shot on the dense best.pt (query_insert_layer 7 vs the
# dense model's 8, num_blocks 3 vs 4 -- a real architecture change), so it gets
# its own fine-tune from the DINOv2 ViT-Base backbone, folds 1+2 (4950 imgs),
# fold 3 val. Compare against dense 39.4, gated cascade 36.5, faithful ALGM 29.9
# (all budget-matched ~937 tokens). MaskMerge's realised budget is set by its
# merge_conf schedule -- measure it after training and, if needed, retune to
# match ~933 for a fair comparison.
#
# Recipe mirrors the dense PanNuke fine-tune (60 epochs, ~309 steps/epoch @
# batch 8 x 2 GPUs). merge_schedule_epochs = max_epochs so the merge threshold
# anneals over the full run.
trainer:
  max_epochs: 40
  check_val_every_n_epoch: 5
model:
  class_path: training.mask_classification_instance.MaskClassificationInstance
  init_args:
    attn_mask_annealing_enabled: False
    network:
      class_path: models.maskmerge.EoMT
      init_args:
        num_q: 200
        num_blocks: 3
        masked_attn_enabled: False
        local_merge_enabled: True
        local_merge_after_layer: 1
        local_merge_window_size: [2, 2]
        local_merge_threshold: 0.88
        merge_start_layer: 7
        merge_interval: 20
        merge_conf_threshold: 0.0
        merge_conf_threshold_end: 0.0
        merge_schedule_epochs: 40
        merge_schedule_enabled: False
        global_merge_score_metric: cosine
        global_merge_mask_constraint: True
        global_merge_min_ratio: 0.0
        olam_mask_source: current
        query_insert_layer: 7
        query_reinsert_layer: 10
        encoder:
          class_path: models.vit.ViT
          init_args:
            patch_size: 16
            backbone_name: vit_base_patch14_reg4_dinov2
data:
  class_path: datasets.pannuke_instance.PanNukeInstance
  init_args:
    num_classes: 5
    img_size: [640, 640]
    batch_size: 8
