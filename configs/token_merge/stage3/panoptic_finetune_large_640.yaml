trainer:
  max_epochs: 7
  logger:
    class_path: lightning.pytorch.loggers.wandb.WandbLogger
    init_args:
      resume: allow
      project: "eomt"
      name: "stage_3_ade20k_panoptic_eomt_large_640_algm_finetune"
model:
  class_path: training.mask_classification_panoptic.MaskClassificationPanoptic
  init_args:
    attn_mask_annealing_enabled: False
    query_lr_mult: 3.0
    query_lr_mult_end: 1.0
    query_lr_schedule: cosine
    query_lr_schedule_steps: [0, 2524]
    head_lr_mult: 1.0
    network:
      class_path: models.eomt_early_layer.EoMT
      init_args:
        num_q: 200
        masked_attn_enabled: False
        query_insert_layer: 12
        merge_start_layer: 12
        merge_interval: 12
        merge_conf_threshold: 0.0
        merge_conf_threshold_end: 0.0
        merge_schedule_epochs: 7
        merge_schedule_enabled: True
        merge_strategy: project
        encoder:
          class_path: models.vit.ViT
data:
  class_path: datasets.ade20k_panoptic.ADE20KPanoptic
  init_args:
    stuff_classes: [0, 1, 2, 3, 4, 5, 6, 9, 11, 13, 16, 17, 21, 25, 26, 28, 29, 34, 40, 46, 48, 51, 52, 54, 59, 60, 61, 63, 68, 77, 79, 84, 91, 94, 96, 99, 100, 101, 105, 106, 109, 113, 114, 117, 122, 128, 131, 140, 141, 145]
