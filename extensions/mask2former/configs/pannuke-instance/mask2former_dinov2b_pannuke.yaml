# Mask2Former + DINOv2-Base ViT backbone, instance seg on PanNuke nuclei.
# SELF-CONTAINED (no _BASE_, to avoid the base chain's unregistered INPUT.LSJ_AUG).
# DENSE training (CTS + ToMe OFF). ToMe cosine backbone-merging is enabled only at
# probe time to test the EoMT/ALGM analog: does merging in the ViT BACKBONE fuse
# twins on twin-dense nuclei (which E/B downstream merging did not)?
MODEL:
  META_ARCHITECTURE: "MaskFormer"
  BACKBONE:
    NAME: "D2DINOv2WithCTS"
  WEIGHTS: ""
  PIXEL_MEAN: [123.675, 116.280, 103.530]
  PIXEL_STD: [58.395, 57.120, 57.375]
  DINOV2_CTS:
    BACKBONE_NAME: "vit_base_patch14_reg4_dinov2"
    PATCH_SIZE: 16
    IMG_SIZE: 512
    DATASET: "coco"
    OUT_CHANNELS: 256
    ENABLE_CTS: False
    CTS_IN_TRAIN: False
    CTS_IN_EVAL: False
    ENABLE_TOME: False
    TOME_IN_TRAIN: False
    TOME_IN_EVAL: False
    POLICY_NET_PATH: ""
  SEM_SEG_HEAD:
    NAME: "MaskFormerHead"
    IGNORE_VALUE: 255
    NUM_CLASSES: 5
    LOSS_WEIGHT: 1.0
    CONVS_DIM: 256
    MASK_DIM: 256
    NORM: "GN"
    PIXEL_DECODER_NAME: "MSDeformAttnPixelDecoder"
    IN_FEATURES: ["res2", "res3", "res4", "res5"]
    DEFORMABLE_TRANSFORMER_ENCODER_IN_FEATURES: ["res3", "res4", "res5"]
    COMMON_STRIDE: 4
    TRANSFORMER_ENC_LAYERS: 6
  MASK_FORMER:
    TRANSFORMER_DECODER_NAME: "MultiScaleMaskedTransformerDecoder"
    TRANSFORMER_IN_FEATURE: "multi_scale_pixel_decoder"
    DEEP_SUPERVISION: True
    NO_OBJECT_WEIGHT: 0.1
    CLASS_WEIGHT: 2.0
    MASK_WEIGHT: 5.0
    DICE_WEIGHT: 5.0
    HIDDEN_DIM: 256
    NUM_OBJECT_QUERIES: 100
    NHEADS: 8
    DROPOUT: 0.0
    DIM_FEEDFORWARD: 2048
    ENC_LAYERS: 0
    PRE_NORM: False
    ENFORCE_INPUT_PROJ: False
    SIZE_DIVISIBILITY: 32
    DEC_LAYERS: 10
    TRAIN_NUM_POINTS: 3136
    OVERSAMPLE_RATIO: 3.0
    IMPORTANCE_SAMPLE_RATIO: 0.75
    TEST:
      SEMANTIC_ON: False
      INSTANCE_ON: True
      PANOPTIC_ON: False
      OVERLAP_THRESHOLD: 0.8
      OBJECT_MASK_THRESHOLD: 0.5
DATASETS:
  TRAIN: ("pannuke_coco_train",)
  TEST: ("pannuke_coco_val",)
SOLVER:
  IMS_PER_BATCH: 4
  BASE_LR: 0.0001
  STEPS: (27000,)
  MAX_ITER: 30000
  WARMUP_FACTOR: 1.0
  WARMUP_ITERS: 1500
  WEIGHT_DECAY: 0.0001
  OPTIMIZER: "ADAMW"
  BACKBONE_MULTIPLIER: 0.1
  CHECKPOINT_PERIOD: 5000
  CLIP_GRADIENTS:
    ENABLED: True
    CLIP_TYPE: "full_model"
    CLIP_VALUE: 0.01
    NORM_TYPE: 2.0
INPUT:
  MIN_SIZE_TRAIN: (256, 320, 384)
  MIN_SIZE_TRAIN_SAMPLING: "choice"
  MIN_SIZE_TEST: 384
  MAX_SIZE_TRAIN: 512
  MAX_SIZE_TEST: 512
  CROP:
    ENABLED: False
  FORMAT: "RGB"
  DATASET_MAPPER_NAME: "mask_former_instance"
TEST:
  EVAL_PERIOD: 5000
  DETECTIONS_PER_IMAGE: 200
DATALOADER:
  FILTER_EMPTY_ANNOTATIONS: True
  NUM_WORKERS: 4
VERSION: 2
